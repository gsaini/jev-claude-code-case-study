[project]
name = "jev-claude-code-case-study"
version = "0.1.0"
description = "Jev + Claude Code, tested: a support-triage app and a Claude Code safety hook where TypeSafe's Jev makes the fast typed decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gopal Saini" }]
dependencies = [
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
triage-desk = "triage_desk.cli:main"
jev-guard = "jev_guard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_common", "src/triage_desk", "src/jev_guard"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["jev_common", "triage_desk", "jev_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
